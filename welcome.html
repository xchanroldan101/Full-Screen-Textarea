<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Containers Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
        }

        .container {
            border: 2px dashed #666;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 5px;
            max-width: 600px;
            margin: 0 auto 20px auto;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1rem;
            color: #000000;
            background-color: #e0e0e0;
            text-decoration: none;
            border: 1px solid #999;
            border-radius: 3px;
            text-align: center;
        }

        .btn:hover {
            background-color: #d0d0d0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome</h1>
        <p>Welcome to my Full Screen Textarea</p>
    </div>

    <div class="container">
        <a href="/welcome/1" class="btn">Next</a>
    </div>

</body>
</html>
