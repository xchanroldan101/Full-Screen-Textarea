<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Textarea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <textarea class="fullscreen" onfocus="this.select()" placeholder="Type something new here..." autofocus maxlength="280782">This is your full screen text that will be completely selected as soon as the page is opened. Start typing immediately to replace it!</textarea>

    <div id="internet-alert" class="hidden">
        No connection. Please check your router, use mobile data, or turn on Wi-Fi.
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
